# Qrels-mechanism family: per-query depth mixture, engine bge_base_zh
# WITNESS evaluator (scripts/eval/evaluate.py) on D1; cross-fitted main methods.
out_dir: ${WITNESS_ROOT}/outputs/d1
id_prefix: t2r
k: 5
pool_systems: [bm25_char1, bm25_char2, bm25_jieba]
pool_k: 5
judges: [flash, pro]
reranker: rerank_qwen3
# per-query depth heterogeneity: a query is judged deeply (logistic a_y + b h + c 1[y=2]) with prob s_deep,
# otherwise only through the hidden engine (first-hit annotation as in configs/eval/mechanism_hidden_dense_d1.yaml)
mnar: {kind: qdepth, a: -2.5, b: 4.0, a_fp: -6.5, c: 0.0, shift: null, s_deep: 0.3, hidden: {engine: bge_base_zh, k: 10, p1: 0.5, p2: 0.9, p_err: 0.03, decay: 0.9, stop_after: 1}}
h_bins: [0.01, 0.34, 0.67, 0.99]   # witness strata on the pool share h (values 0, 1/3, 2/3, 1)
budgets: [800, 3200, 12800]
fracs: [0.25, 0.75]     # stage split for the two-stage ablations (the main method is one stage)
alpha: 0.05
z_plan: 2.5              # certification threshold used for planning (BH over 2P one-sided nulls)
ridge: 20.0              # the base predictor is worth this many labelled items in GREG
pi_min_frac: 0.2         # pi_min = pi_min_frac * stage budget / frame size
v_floor: 0.03            # floor of the working Var(u | x) before calibration
cell_prior: 10           # pseudo-items of the model variance in the per-cell calibration
plan_iters: 2
xfit_folds: 5            # frame-partition cross-fitting folds (lam: xfit)
reps: 10                 # D1 ~8-10 min per repetition
seed: 0
tag: mqd
methods: [classical, ppi_tuned_xfit, active_xfit, witness_xfit, witness_fam_xfit, abl_f_judge_xfit]
